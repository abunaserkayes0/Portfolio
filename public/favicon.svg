<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Developer Terminal Window Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2" />

  <!-- Window Header with Traffic Lights (macOS/Terminal vibes) -->
  <circle cx="12" cy="13" r="2.6" fill="#EF4444" />
  <circle cx="20" cy="13" r="2.6" fill="#F59E0B" />
  <circle cx="28" cy="13" r="2.6" fill="#10B981" />
  <line x1="2" y1="21" x2="62" y2="21" stroke="#1E293B" stroke-width="1.2" />

  <!-- Code / Terminal Prompt Body: > ank_ -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-weight="900">
    <!-- Shell Prompt > -->
    <text x="8" y="47" font-size="21" fill="#38BDF8" filter="url(#glow)">&gt;</text>
    <!-- Brand ank -->
    <text x="21" y="46" font-size="18.5" fill="#F8FAFC" letter-spacing="-0.5">ank</text>
    <!-- Glowing Terminal Cursor _ -->
    <rect x="54" y="32" width="3" height="15" rx="1" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
